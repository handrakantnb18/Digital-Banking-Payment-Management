
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**

        - id: audit-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/audit/**


logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG